name: Publish

# Marten's API reads the registry from one file, registry.json on the `latest` release. Every push to main that
# passes validation rebuilds it.
on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.2
      - run: bun scripts/validate.ts
      - run: bun scripts/build-index.ts dist/registry.json
      - name: Attach to the latest release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view latest >/dev/null 2>&1 || gh release create latest --title "Latest" --notes "The registry's index, rebuilt on every push to main."
          gh release upload latest dist/registry.json --clobber
