name: Validate

on:
  pull_request:
  push:
    branches: [main]

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.2
      - run: bun scripts/validate.ts
      - name: Changed listings bump their version
        if: github.event_name == 'pull_request'
        run: bun scripts/check-versions.ts origin/${{ github.base_ref }}
